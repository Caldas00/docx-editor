[project]
name = "docx-agent"
version = "0.1.0"
description = "LangGraph agent that edits existing Word documents from natural-language instructions without damaging formatting"
authors = [
    { name = "Francisco Caldas", email = "franciscopirescaldas@tecnico.ulisboa.pt" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[project.scripts]
docx-agent = "docx_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["llm: tests that call the real OpenAI API (deselect with -m 'not llm')"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905"]
